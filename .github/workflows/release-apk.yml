name: Build & Release Harmoni EQ APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nama tag rilis (contoh: v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests & lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK for release
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "Harmoni-EQ-${TAG}.apk"
          echo "APK_NAME=Harmoni-EQ-${TAG}.apk" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Harmoni EQ ${{ env.RELEASE_TAG }}"
          body: |
            Unduh file `.apk` di bawah ini untuk langsung memasang **Harmoni EQ** di perangkat Android tanpa perlu clone atau build kode sumber.

            ### Perubahan Utama
            - Modern UI dengan permukaan translucent halus (Light, Dark, & Custom Accent)
            - Pengaturan Reduce Transparency & Reduce Motion tersimpan di DataStore
            - Optimasi performa fader 60fps (RenderEffect API 31+, bitmap backdrop statis)
          files: |
            ${{ env.APK_NAME }}
